[info]
name              = "IwacSearch"
description       = "Single Omeka S module that owns the public discovery experience (search + curated browse + facets) for the IWAC archive, backed by Typesense. Replaces AdvancedSearch + SearchSolr + FacetedBrowse on the public side."
author            = "Frédérick Madore"
configurable      = true
version           = "0.1.0-dev"
module_link       = "https://github.com/fmadore/IwacSearch"
author_link       = "https://www.frederickmadore.com"
omeka_version_constraint = "^4.0"
