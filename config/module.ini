[info]
name              = "IwacSearch"
description       = "Single Omeka S module that owns the public discovery experience (faceted search, federated content+entities search, and page-block search scopes) for the IWAC archive, backed by Typesense. Replaces AdvancedSearch + SearchSolr + FacetedBrowse on the public side."
author            = "Frédérick Madore"
configurable      = true
version           = "3.4.0"
module_link       = "https://github.com/fmadore/IwacSearch"
author_link       = "https://www.frederickmadore.com"
omeka_version_constraint = "^4.0"
