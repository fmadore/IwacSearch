# Dependabot configuration.
#
# Three ecosystems live in this repo:
#   - npm        (Svelte client: vite/svelte/typescript/eslint/prettier)
#   - composer   (PHP module: typesense/typesense-php, symfony/yaml,
#                 the Guzzle HTTP stack)
#   - github-actions  (CI workflows in .github/workflows/)
#
# Strategy: weekly cadence, group all patch + minor updates into one PR
# per ecosystem to cut PR noise. Major updates always get their own PR
# so we can review breaking changes individually.
#
# To pause version bumps temporarily, set open-pull-requests-limit: 0.

version: 2
updates:
  # ── Svelte client (root package.json) ─────────────────────────────────
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'npm'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'javascript'
    groups:
      svelte-toolchain:
        patterns:
          - 'svelte'
          - 'svelte-*'
          - '@sveltejs/*'
          - 'vite'
          - 'vite-*'
          - '@vitejs/*'
        update-types:
          - 'minor'
          - 'patch'
      lint-format:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'prettier'
          - 'prettier-*'
          - 'typescript-eslint'
        update-types:
          - 'minor'
          - 'patch'
      types:
        patterns:
          - '@types/*'
          - '@tsconfig/*'
        update-types:
          - 'minor'
          - 'patch'
      typescript:
        patterns:
          - 'typescript'
          - 'tslib'
        update-types:
          - 'minor'
          - 'patch'

  # ── PHP module (root composer.json) ───────────────────────────────────
  - package-ecosystem: 'composer'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'composer'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'php'
    groups:
      php-runtime:
        patterns:
          - 'typesense/*'
          - 'symfony/*'
          # Guzzle HTTP stack (typesense-php's transport) — without these
          # patterns each got its own weekly PR, defeating the grouping.
          - 'guzzlehttp/*'
          - 'php-http/*'
          - 'http-interop/*'
        update-types:
          - 'minor'
          - 'patch'

  # ── GitHub Actions (.github/workflows/) ───────────────────────────────
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'ci'
    groups:
      actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
