# Release: build the installable Omeka S module zip and publish it on the tag.
#
# Before this workflow existed, every release shipped source only — no asset —
# so the sole install path was `git clone` + `composer install`, which is not
# how Omeka S modules are distributed. Omeka expects a zip whose single top
# level directory is named exactly after the module, dropped into `modules/`.
#
# The zip is assembled from `git archive`, so the `export-ignore` rules in
# .gitattributes decide what ships; the Svelte sources and docs/ come out on
# top of that (they are build inputs and prose, not runtime code), and a
# production `vendor/` goes in. What is left is exactly what the module needs
# to boot: Module.php, config/, src/ PHP, view/, data/, cli/, asset/ (with the
# committed asset/dist bundles) and vendor/.
#
# Release dependencies come from the committed PHP-8.2-compatible composer.lock.
#
# Two jobs, so that no third-party code runs with a write token: `build` runs
# npm, Vite, Composer and the checks with a read-only token and uploads the
# zip as a run artifact; `publish` (tags only) holds `contents: write` and
# does nothing but download that artifact and attach it to the release.
# Actions are pinned to commit SHAs; Dependabot keeps the pins current.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build + verify module zip
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      zip: ${{ steps.version.outputs.zip }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tag is the single source of truth for the version, but four files
      # restate it: Omeka reads config/module.ini, the client build reads
      # package.json, `npm ci` reads package-lock.json, and citation tooling
      # reads CITATION.cff. A tag that disagrees with any of them ships a
      # module that reports the wrong version — catch it before anything is
      # built. The lockfile is checked here because it is the one that
      # actually drifted: it sat at 3.13.1 across the 3.14.0, 3.15.0, 3.16.0
      # and 3.16.1 releases, each of whose commits claimed to bump every
      # version declaration, because nothing verified the claim.
      - name: Resolve version and check every declaration agrees
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/^version *= *"\(.*\)"/\1/p' config/module.ini)"
            echo "::notice::Manual run — version taken from module.ini ($VERSION)"
          fi

          INI="$(sed -n 's/^version *= *"\(.*\)"/\1/p' config/module.ini)"
          PKG="$(node -p "require('./package.json').version")"
          # Both places npm writes it: the top-level field and the root package
          # entry. `npm install --package-lock-only` keeps them in step, but a
          # hand-edit of one and not the other should still fail loudly.
          LOCK="$(node -p "require('./package-lock.json').version")"
          LOCK_ROOT="$(node -p "require('./package-lock.json').packages[''].version")"
          CFF="$(sed -n 's/^version: *//p' CITATION.cff | tr -d '"' | head -1)"

          echo "tag=$VERSION  module.ini=$INI  package.json=$PKG  package-lock.json=$LOCK/$LOCK_ROOT  CITATION.cff=$CFF"
          [ "$VERSION" = "$INI" ] || { echo "::error::tag $VERSION != config/module.ini $INI"; exit 1; }
          [ "$VERSION" = "$PKG" ] || { echo "::error::tag $VERSION != package.json $PKG"; exit 1; }
          [ "$VERSION" = "$LOCK" ] || { echo "::error::tag $VERSION != package-lock.json $LOCK — run 'npm install --package-lock-only'"; exit 1; }
          [ "$VERSION" = "$LOCK_ROOT" ] || { echo "::error::tag $VERSION != package-lock.json packages[''] $LOCK_ROOT — run 'npm install --package-lock-only'"; exit 1; }
          [ "$VERSION" = "$CFF" ] || { echo "::error::tag $VERSION != CITATION.cff $CFF"; exit 1; }

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=IwacSearch-v$VERSION.zip" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install client deps
        run: npm ci --no-audit --no-fund

      - name: Test + build client
        run: |
          npm run lint
          npm test
          npm run build

      # Same guard as CI. asset/dist is committed because production has no
      # Node toolchain, and the zip ships the committed copy — so a tag whose
      # bundle is stale would ship stale JS to every install. Fail loudly.
      - name: Verify committed bundles match the source
        run: |
          git diff --exit-code -- asset/dist \
            || (echo '::error::asset/dist is stale at this tag — rebuild and retag' && exit 1)

      # 8.2 is the composer.json floor. Resolving there yields a vendor tree
      # that runs on every supported PHP, including the live server's 8.5.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Assemble the module tree
        run: |
          set -euo pipefail
          mkdir -p build
          # export-ignore in .gitattributes filters out the dev toolchain.
          git archive --format=tar --prefix=IwacSearch/ HEAD | tar -x -C build
          # Build inputs and prose that survive export-ignore because the
          # source tarball should keep them — the runtime module should not.
          rm -rf build/IwacSearch/src/svelte \
                 build/IwacSearch/src/svelte-shared \
                 build/IwacSearch/docs
          test -f build/IwacSearch/composer.lock
          composer install \
            --working-dir=build/IwacSearch \
            --no-dev --optimize-autoloader \
            --no-interaction --no-progress --prefer-dist

      # Omeka's core vendor/ already provides Laminas at runtime. A bundled
      # duplicate makes PHP load the wrong copy of an interface and fatals the
      # whole site, not just this module — it has happened here before. The
      # composer.json declares no laminas/*, and this keeps it that way even
      # if a future dependency drags one in transitively.
      - name: Assert no Laminas is bundled
        run: |
          if [ -d build/IwacSearch/vendor/laminas ]; then
            echo "::error::vendor/laminas is present — it would collide with Omeka core"
            ls build/IwacSearch/vendor/laminas
            exit 1
          fi
          echo "psr/* packages present (transitive, via the Guzzle PSR adapters):"
          ls build/IwacSearch/vendor/psr 2>/dev/null || echo "  none"

      - name: Create the zip
        run: |
          set -euo pipefail
          (cd build && zip -qr "../${{ steps.version.outputs.zip }}" IwacSearch)
          echo "Built ${{ steps.version.outputs.zip }} ($(du -h "${{ steps.version.outputs.zip }}" | cut -f1))"

      - name: Verify the zip is installable and carries no dev tooling
        run: |
          set -euo pipefail
          ZIP="${{ steps.version.outputs.zip }}"

          for f in IwacSearch/Module.php \
                   IwacSearch/config/module.ini \
                   IwacSearch/config/module.config.php \
                   IwacSearch/vendor/autoload.php \
                   IwacSearch/asset/dist/iwac-search.js \
                   IwacSearch/asset/dist/iwac-search.css \
                   IwacSearch/asset/dist/iwac-search-header.js \
                   IwacSearch/asset/dist/iwac-search-header.css \
                   IwacSearch/data/schema.yaml \
                   IwacSearch/LICENSE; do
            unzip -l "$ZIP" "$f" > /dev/null 2>&1 \
              || { echo "::error::missing from zip: $f"; exit 1; }
          done

          # Only the module's own tree is policed. Third-party packages ship
          # their own .github/, tests/ and package.json, and those are a
          # normal part of a vendor tree — not this repo's tooling leaking.
          # What matters about vendor/ is that --no-dev worked, checked below.
          LEAKED="$(unzip -Z1 "$ZIP" | grep -v '^IwacSearch/vendor/' \
            | grep -E '(^|/)(tests|node_modules|\.github|scripts|tools|src/svelte)/|(package\.json|package-lock\.json|phpunit\.xml|phpstan\.neon|tsconfig\.json|vite\.config\.ts|vitest\.config\.ts|eslint\.config\.js|CLAUDE\.md)$' || true)"
          if [ -n "$LEAKED" ]; then
            echo "::error::dev tooling leaked into the zip:"
            echo "$LEAKED"
            exit 1
          fi

          for dev in phpunit phpstan; do
            if unzip -Z1 "$ZIP" | grep -q "^IwacSearch/vendor/$dev/"; then
              echo "::error::vendor/$dev is present — the install was not --no-dev"
              exit 1
            fi
          done

          echo "Zip verified: $(unzip -Z1 "$ZIP" | wc -l) entries, no dev tooling."

      # Manual runs exist to prove the build still works without cutting a
      # release; they stop here, with the zip downloadable from the run. On a
      # tag the same artifact is what the publish job attaches.
      - name: Upload the zip as a run artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.version.outputs.zip }}
          path: ${{ steps.version.outputs.zip }}
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.build.outputs.zip }}

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ZIP: ${{ needs.build.outputs.zip }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          test -f "$ZIP"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --title "$VERSION" --generate-notes
          fi
