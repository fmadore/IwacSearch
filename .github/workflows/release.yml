# Release: build the installable Omeka S module zip and publish it on the tag.
#
# Before this workflow existed, every release shipped source only — no asset —
# so the sole install path was `git clone` + `composer install`, which is not
# how Omeka S modules are distributed. Omeka expects a zip whose single top
# level directory is named exactly after the module, dropped into `modules/`.
#
# The zip is assembled from `git archive`, so the `export-ignore` rules in
# .gitattributes decide what ships; the Svelte sources and docs/ come out on
# top of that (they are build inputs and prose, not runtime code), and a
# production `vendor/` goes in. What is left is exactly what the module needs
# to boot: Module.php, config/, src/ PHP, view/, data/, cli/, asset/ (with the
# committed asset/dist bundles) and vendor/.
#
# Release dependencies come from the committed PHP-8.2-compatible composer.lock.
#
# Three jobs, so that nothing ships unchecked and no third-party code runs with
# a write token:
#
#   gates    the whole push/PR suite (ci.yml, called as a reusable workflow) on
#            the tagged tree — lint, svelte-check, vitest, build + bundle diff,
#            PHP lint, PHPUnit, PHPStan on every matrix leg, the integration
#            contracts. Reusable calls ignore path filters, so every gate runs.
#   build    resolves and checks the version, assembles and verifies the zip
#            with a read-only token, uploads it as a run artifact.
#   publish  (tags only) needs BOTH, holds `contents: write`, and does nothing
#            but download that artifact and attach it to the release.
#
# Actions are pinned to commit SHAs; Dependabot keeps the pins current.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    name: CI suite on the tagged tree
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build + verify module zip
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      zip: ${{ steps.version.outputs.zip }}

    steps:
      # fetch-depth 0 so the ancestry check below can see the default branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A tag on a commit that never reached main (a local experiment, a
      # branch nobody merged) would publish code that has had no review and
      # that main does not contain. The gates job proves the tree is green;
      # this proves it is the tree everyone else has.
      - name: Assert the tagged commit is on the default branch
        if: github.ref_type == 'tag'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not an ancestor of origin/$DEFAULT_BRANCH — merge it before tagging"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      # The tag is the single source of truth for the version, and every file
      # that restates it must agree. The list of those files is DATA —
      # scripts/lib/versions.js, shared with the writer (`npm run bump`) and the
      # push-time guard in ci.yml. It used to be an inline list here, which is
      # how package-lock.json sat at 3.13.1 across four releases: the gate
      # asserted what a human remembered, and only at tag time.
      - name: Resolve version and check every declaration agrees
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
            echo "::notice::Manual run — version taken from package.json ($VERSION)"
          fi
          node scripts/check-versions.js "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=IwacSearch-v$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Install client deps
        run: npm ci --no-audit --no-fund

      # The gates job ran the full suite; this rebuild exists only because the
      # zip is assembled from THIS job's tree, and must carry the bundle the
      # source produces.
      - name: Build client
        run: npm run build

      # Same guard as CI. asset/dist is committed because production has no
      # Node toolchain, and the zip ships the committed copy — so a tag whose
      # bundle is stale would ship stale JS to every install. Fail loudly.
      - name: Verify committed bundles match the source
        run: |
          git diff --exit-code -- asset/dist \
            || (echo '::error::asset/dist is stale at this tag — rebuild and retag' && exit 1)

      # 8.2 is the composer.json floor. Resolving there yields a vendor tree
      # that runs on every supported PHP, including the live server's 8.5.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Assemble the module tree
        run: |
          set -euo pipefail
          mkdir -p build
          # export-ignore in .gitattributes filters out the dev toolchain.
          git archive --format=tar --prefix=IwacSearch/ HEAD | tar -x -C build
          # Build inputs and prose that survive export-ignore because the
          # source tarball should keep them — the runtime module should not.
          rm -rf build/IwacSearch/src/svelte \
                 build/IwacSearch/src/svelte-shared \
                 build/IwacSearch/docs
          test -f build/IwacSearch/composer.lock
          composer install \
            --working-dir=build/IwacSearch \
            --no-dev --optimize-autoloader \
            --no-interaction --no-progress --prefer-dist

      # Omeka's core vendor/ already provides Laminas at runtime. A bundled
      # duplicate makes PHP load the wrong copy of an interface and fatals the
      # whole site, not just this module — it has happened here before. The
      # composer.json declares no laminas/*, and this keeps it that way even
      # if a future dependency drags one in transitively.
      - name: Assert no Laminas is bundled
        run: |
          if [ -d build/IwacSearch/vendor/laminas ]; then
            echo "::error::vendor/laminas is present — it would collide with Omeka core"
            ls build/IwacSearch/vendor/laminas
            exit 1
          fi
          echo "psr/* packages present (transitive, via the Guzzle PSR adapters):"
          ls build/IwacSearch/vendor/psr 2>/dev/null || echo "  none"

      # Not `ZIP`: Info-ZIP reads $ZIP as default command-line arguments, so an
      # env var by that name made `zip` treat the archive name as an option
      # list and write the file somewhere else — v3.22.0's first release run
      # built nothing at the path the verify step reads.
      - name: Create the zip
        env:
          ZIP_FILE: ${{ steps.version.outputs.zip }}
        run: |
          set -euo pipefail
          (cd build && zip -qr "../$ZIP_FILE" IwacSearch)
          test -f "$ZIP_FILE" || { echo "::error::zip was not written to $ZIP_FILE"; exit 1; }
          echo "Built $ZIP_FILE ($(du -h "$ZIP_FILE" | cut -f1))"

      - name: Verify the zip is installable and carries no dev tooling
        env:
          ZIP_FILE: ${{ steps.version.outputs.zip }}
        run: |
          set -euo pipefail

          for f in IwacSearch/Module.php \
                   IwacSearch/config/module.ini \
                   IwacSearch/config/module.config.php \
                   IwacSearch/vendor/autoload.php \
                   IwacSearch/asset/dist/iwac-search.js \
                   IwacSearch/asset/dist/iwac-search.css \
                   IwacSearch/asset/dist/iwac-search-header.js \
                   IwacSearch/asset/dist/iwac-search-header.css \
                   IwacSearch/asset/css/iwac-search.css \
                   IwacSearch/asset/img/ai-generated-eu.svg \
                   IwacSearch/language/fr.mo \
                   IwacSearch/data/schema.yaml \
                   IwacSearch/LICENSE; do
            unzip -l "$ZIP_FILE" "$f" > /dev/null 2>&1 \
              || { echo "::error::missing from zip: $f"; exit 1; }
          done

          # Only the module's own tree is policed. Third-party packages ship
          # their own .github/, tests/ and package.json, and those are a
          # normal part of a vendor tree — not this repo's tooling leaking.
          # What matters about vendor/ is that --no-dev worked, checked below.
          LEAKED="$(unzip -Z1 "$ZIP_FILE" | grep -v '^IwacSearch/vendor/' \
            | grep -E '(^|/)(tests|node_modules|\.github|scripts|tools|src/svelte)/|(package\.json|package-lock\.json|phpunit\.xml|phpstan\.neon|tsconfig\.json|vite\.config\.ts|vitest\.config\.ts|eslint\.config\.js|CLAUDE\.md|\.nvmrc)$' || true)"
          if [ -n "$LEAKED" ]; then
            echo "::error::dev tooling leaked into the zip:"
            echo "$LEAKED"
            exit 1
          fi

          for dev in phpunit phpstan; do
            if unzip -Z1 "$ZIP_FILE" | grep -q "^IwacSearch/vendor/$dev/"; then
              echo "::error::vendor/$dev is present — the install was not --no-dev"
              exit 1
            fi
          done

          echo "Zip verified: $(unzip -Z1 "$ZIP_FILE" | wc -l) entries, no dev tooling."

      # Manual runs exist to prove the build still works without cutting a
      # release; they stop here, with the zip downloadable from the run. On a
      # tag the same artifact is what the publish job attaches.
      - name: Upload the zip as a run artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.version.outputs.zip }}
          path: ${{ steps.version.outputs.zip }}
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [gates, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.zip }}

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ZIP_FILE: ${{ needs.build.outputs.zip }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          test -f "$ZIP_FILE"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP_FILE" --clobber
          else
            gh release create "$TAG" "$ZIP_FILE" --title "$VERSION" --generate-notes
          fi
