# CI: lint, type-check, test and build both sides on every PR + push to main.
#
# Real Omeka/Typesense contracts run in the integration job below.
#
# Also a reusable workflow: release.yml calls it (`workflow_call`) and makes its
# publish job `needs:` it, so a tag can only ship if this exact suite —
# svelte-check, vitest, PHPUnit and PHPStan included — passed on the tagged
# tree. Before that, the release job re-ran a hand-picked subset (no
# svelte-check, no PHPUnit, no PHPStan), so a commit CI had failed could still
# be released.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# `ci-` prefix: when release.yml calls this workflow, github.workflow is the
# CALLER's name, and concurrency group names are case-insensitive — without the
# prefix this group would collide with release.yml's own `release-<ref>` group
# and cancel the release that called it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Svelte client (lint + check + build)
    runs-on: ubuntu-latest
    # Each job takes about a minute; the timeouts are there so a hung step
    # (a stalled registry, a test waiting on a socket) fails in minutes rather
    # than holding a runner for GitHub's default six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install
        run: npm ci --no-audit --no-fund

      # Every version declaration agrees (scripts/lib/versions.js is the list),
      # and CHANGELOG.md has a dated, non-empty section for that version — the
      # one release.yml publishes as the release notes. On every push, so drift
      # is caught on the commit that introduces it — not at the next tag, which
      # is the only place it used to be checked.
      - name: Version declarations and changelog agree
        run: npm run check:versions

      # npm audit at high+, minus the exceptions written down (with reasons)
      # in scripts/lib/audit-exceptions.js.
      - name: Audit (npm audit, documented exceptions only)
        run: npm run check:audit

      - name: Lint (eslint + prettier)
        run: npm run lint

      - name: Type-check (svelte-check)
        run: npm run check

      - name: Unit tests (vitest)
        run: npm test

      # asset/dist is a build product, not tracked: the release zip carries
      # the bundle release.yml builds from the tag, so there is no committed
      # copy to fall out of step with the source (this job used to diff one).
      # check:size, the build's last step, reads all four bundles, so a build
      # that failed to write one fails here.
      - name: Build
        run: npm run build

  # The built bundle in a real browser (Chromium): mount with and without the
  # server's first page, typing and the typeahead, facets and result chips,
  # the empty / error / retry states, the federated tabs, the phone drawer,
  # dark mode, axe and a 320px viewport. Every request — page, bundle, token,
  # Typesense — is stubbed (tests/browser/fixture.ts), so no services.
  browser:
    name: Svelte client in a browser (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests (build + playwright)
        run: npm run test:browser

  php:
    name: PHP module (syntax + unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # 8.4 = composer.json floor;
        # 8.5 = the live server's runtime — the leg that must stay green.
        php-version: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      # The PHP counterpart of check:audit, against the committed lock: the
      # tree the release zip's vendor/ is installed from (--no-dev) plus the
      # dev tools CI runs. --locked reads composer.lock alone, so it needs no
      # install and fails before one. An advisory to live with goes, with its
      # reason, under config.audit.ignore in composer.json.
      - name: Audit (composer audit, locked dependencies)
        run: composer audit --locked

      - name: Install composer deps
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHP syntax check (lint pass)
        run: |
          find Module.php config cli src view tests tools \( -name '*.php' -o -name '*.phtml' \) -print0 \
            | xargs -0 -n1 php -l > /tmp/php-lint.log 2>&1 \
            || (cat /tmp/php-lint.log && exit 1)

      # PSR-12 over the module's PHP; the files it covers and the few
      # exemptions are in phpcs.xml.dist. `vendor/bin/phpcbf` applies the
      # mechanical fixes.
      - name: Coding standard (phpcs, PSR-12)
        run: composer lint

      - name: Unit tests (phpunit)
        run: vendor/bin/phpunit

      - name: Static analysis (phpstan)
        run: vendor/bin/phpstan analyse --no-progress

  integration:
    name: Omeka 4.2.1 + Typesense 30.2 contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: curl, mbstring, pdo_mysql
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Provision disposable services
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mariadb-server unzip
          sudo bash tests/integration/setup-local.sh
      - name: Exercise SQL, events, public keys and guarded reindex
        run: sudo php tests/integration/rebuild.php
