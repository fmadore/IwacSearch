# CI: lint, type-check, and build the Svelte client on every PR + push to main.
#
# We deliberately do NOT run PHP integration tests here yet — the indexer
# requires a live Typesense instance. Unit tests for the pure seams (the
# mappers, CountryResolver, FacetCatalog, PresetCatalog) are the next step;
# see docs/engineering-roadmap.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Svelte client (lint + check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint (eslint + prettier)
        run: npm run lint

      - name: Type-check (svelte-check)
        run: npm run check

      - name: Build
        run: npm run build

      # asset/dist is committed (production has no Node toolchain), so a PR
      # that edits src/svelte* without rebuilding would ship a stale bundle.
      # The Vite lib build has fixed filenames and no content hashes, so a
      # byte diff against the committed output is the sync check.
      - name: Verify committed bundles match the source
        run: |
          test -f asset/dist/iwac-search.js
          test -f asset/dist/iwac-search.css
          test -f asset/dist/iwac-search-header.js
          test -f asset/dist/iwac-search-header.css
          git diff --exit-code -- asset/dist \
            || (echo '::error::asset/dist is stale — run `npm run build` and commit the result' && exit 1)

  php:
    name: PHP module (syntax check)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 8.2 = composer.json floor (production containers may lag);
        # 8.4 = current.
        php-version: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install composer deps
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHP syntax check (lint pass)
        run: |
          find Module.php config cli src view \( -name '*.php' -o -name '*.phtml' \) -print0 \
            | xargs -0 -n1 php -l > /tmp/php-lint.log 2>&1 \
            || (cat /tmp/php-lint.log && exit 1)
