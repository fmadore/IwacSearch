# CI: lint, type-check, test and build both sides on every PR + push to main.
#
# Still NO integration tests: the indexer needs a live Typesense and a real
# Omeka database. What the unit suites cover is the pure seams — the URL
# codec, query builders and sanitiser on the client; the mappers,
# CollectionOps' alias guard, and the catalogues on the PHP side. Those are
# where the behaviour lives and where it has silently regressed before.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Svelte client (lint + check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint (eslint + prettier)
        run: npm run lint

      - name: Type-check (svelte-check)
        run: npm run check

      - name: Unit tests (vitest)
        run: npm test

      - name: Build
        run: npm run build

      # asset/dist is committed (production has no Node toolchain), so a PR
      # that edits src/svelte* without rebuilding would ship a stale bundle.
      # The Vite lib build has fixed filenames and no content hashes, so a
      # byte diff against the committed output is the sync check.
      - name: Verify committed bundles match the source
        run: |
          test -f asset/dist/iwac-search.js
          test -f asset/dist/iwac-search.css
          test -f asset/dist/iwac-search-header.js
          test -f asset/dist/iwac-search-header.css
          git diff --exit-code -- asset/dist \
            || (echo '::error::asset/dist is stale — run `npm run build` and commit the result' && exit 1)

  php:
    name: PHP module (syntax + unit tests)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 8.2 = composer.json floor (production containers may lag);
        # 8.4 = current.
        php-version: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install composer deps
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHP syntax check (lint pass)
        run: |
          find Module.php config cli src view tests \( -name '*.php' -o -name '*.phtml' \) -print0 \
            | xargs -0 -n1 php -l > /tmp/php-lint.log 2>&1 \
            || (cat /tmp/php-lint.log && exit 1)

      - name: Unit tests (phpunit)
        run: vendor/bin/phpunit

      # ADVISORY until someone runs it locally and fixes what it finds — see
      # the header of phpstan.neon. The config and the Omeka/Laminas stubs it
      # needs are committed, but the analysis has never been executed, so
      # failing the build on it would be gating on an unknown. Read the step's
      # output, get it green, then delete `continue-on-error` here.
      - name: Static analysis (phpstan) — advisory
        continue-on-error: true
        run: vendor/bin/phpstan analyse --no-progress
