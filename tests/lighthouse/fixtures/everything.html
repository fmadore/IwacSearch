_s":"audiovisual"},"highlight":[],"highlights":[]},{"document":{"abstract":"Une vingtaine de terroristes, dont trois chefs, ont été neutralisés le 21 juillet 2026 par les Forces combattantes dans la zone de Sollobo, commune de Titao, province du Loroum, selon l’AIB. L’opération a permis de récupérer des engins roulants, des armes, des munitions, du numéraire et divers matériels. Parmi les chefs figure Khalidou Tall, alias Yéro ou Wahilou, présenté comme un responsable opérationnel du GSIM actif dans le Yaadga.","abstract_ai":true,"author_entity_ids":[115601],"country_ss":["Burkina Faso"],"creator_sort":"latif abdoul","creator_ss":["Abdoul Latif"],"date":1787011200,"date_decade_ss":["2020s"],"entity_aliases_txt":["GSIM","JNIM","Jama\u0027at Nusrat al-Islam wal-Muslimin","Groupe dit de soutien à l\u0027Islam et aux musulmans","groupe pour le soutien de l\u0027Islam et des Musulmans","Soutien à l\u0027Islam et aux Musulmans","Jihadisme","Haute-Volta","Upper Volta","Burkina-Faso","Burkina","Yaadga","Kossi"],"entity_ids":[580,33,63531,76042,76274,14322,546,76315,127114,125805,126301,127009,126271,125880],"has_fulltext":false,"id":"116033","identifier":"iwac-article-0016269","is_public":true,"item_set_ids":[23448],"language_ss":["Français"],"nb_words":298,"newspaper_ss":["Faso Actu"],"omeka_url":"https://islam.zmo.de/s/afrique_ouest/item/116033","organisations_ss":["Groupe de Soutien à l\u0027Islam et aux Musulmans"],"places_ss":["Titao","Burkina Faso","Yatenga","Thiou","Région du Nord (Burkina Faso)","Sollé","Kinsèrè","Barani","Province du Kossi"],"pub_year":2026,"source_url":"https://web.archive.org/web/20260914195339/https://faso-actu.info/burkina-loroum-une-vingtaine-de-terroristes-neutralises-dont-plusieurs-chefs/","subjects_ss":["Groupe de Soutien à l\u0027Islam et aux Musulmans","Terrorisme","Djihadisme","Conflit","Sécurité"],"title":"Burkina/Loroum : une vingtaine de terroristes neutralisés, dont plusieurs chefs","title_txt":"Burkina/Loroum : une vingtaine de terroristes neutralisés, dont plusieurs chefs","topics_ss":["Terrorisme","Djihadisme","Conflit","Sécurité"],"type_s":"article"},"highlight":[],"highlights":[]},{"document":{"abstract":"Une opération coordonnée menée le 21 juillet 2026 dans la zone de Sollobo, commune de Titao, a neutralisé une vingtaine de terroristes et récupéré des engins, armes, munitions, numéraire et autres matériels. Trois chefs figuraient parmi les tués, dont Khalidou Tall, alias Yéro ou Wahilou, originaire de Sim et actif dans le Lorum et le Yatenga. Son groupe était notamment impliqué dans l’embuscade du convoi de ravitaillement de Sollé et dans des actions attribuées au GSIM.","abstract_ai":true,"author_entity_ids":[112561],"creator_sort":"ilboudo charles","creator_ss":["Charles Ilboudo"],"date":1787011200,"date_decade_ss":["2020s"],"entity_aliases_txt":["Capitaine Ibrahim Traoré","GSIM","JNIM","Jama\u0027at Nusrat al-Islam wal-Muslimin","Groupe dit de soutien à l\u0027Islam et aux musulmans","groupe pour le soutien de l\u0027Islam et des Musulmans","Soutien à l\u0027Islam et aux Musulmans","Jihadisme","Haute-Volta","Upper Volta","Burkina-Faso","Burkina","Yaadga"],"entity_ids":[111935,580,33,76274,76042,63531,109,76332,14322,546,76315,127114,125805,126301,126271,127009],"has_fulltext":false,"id":"112596","identifier":"iwac-article-0012962","is_public":true,"item_set_ids":[111930],"language_ss":["Français"],"nb_words":303,"newspaper_ss":["Actualite.bf"],"omeka_url":"https://islam.zmo.de/s/afrique_ouest/item/112596","organisations_ss":["Groupe de Soutien à l\u0027Islam et aux Musulmans"],"persons_ss":["Ibrahim Traoré"],"places_ss":["Titao","Burkina Faso","Yatenga","Thiou","Région du Nord (Burkina Faso)","Sollé","Barani","Kinsèrè"],"pub_year":2026,"source_url":"https://web.archive.org/web/20260818153046/https://www.actualite.bf/loroum-plusieurs-chefs-chefs-terroristes-et-leurs-hommes-neutralises-par-nos-forces-combattantes/","subjects_ss":["Ibrahim Traoré","Groupe de Soutien à l\u0027Islam et aux
