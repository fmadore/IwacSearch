# IwacSearch — Typesense collection schema
#
# This file is the contract between the indexer and the search UI. Every
# downstream artefact (Svelte facet panel, scoped-key rules, browse configs)
# derives from it. Edit with care.
#
# Conventions:
#   - Names ending in `_ss` are multi-valued strings (facets).
#   - Names ending in `_s`  are single-valued strings (sort keys).
#   - Names ending in `_txt` are full-text indexed with the French analyser.
#   - The French PROSE fields (title_txt, ocr_text, abstract) carry
#     `stem: true` — Typesense's Snowball French stemmer folds word-forms
#     of the same root (musulman/musulmans/musulmane, islamique/islamiques)
#     so a query for one matches the others. Stemming is applied to the
#     keyword inverted index only; the embedding model still receives the
#     raw field text, so semantic recall is unaffected. entity_aliases_txt
#     is deliberately NOT stemmed — it holds proper nouns and acronyms
#     (AOF, RCI, names) that a stemmer would mangle.
#   - `embedding` uses Typesense's in-process ts/multilingual-e5-small ONNX
#     model (384d). Re-embedded at index AND query time, so no external API
#     dependency at search time.
#
# Versioning:
#   - The actual collection is named `iwac_v2` and aliased as `iwac_current`.
#     (v1 → v2 bump: added French stemming on the prose fields + linked the
#     `iwac_diversity` curation set — both are index-time changes that need
#     a fresh collection.)
#   - Schema changes ⇒ bump the name (`iwac_v2` → `iwac_v3`), atomic-swap
#     the alias. The browser only ever queries the alias, so swaps are
#     zero-downtime.
#
# Source-of-truth for content fields:
#   - Bulk fields (title, ocr_text, sentiment, topic labels, ...) come from
#     the HuggingFace dataset (fmadore/islam-west-africa-collection) on the
#     bulk reindex path. See docs/data-sources.md.
#   - is_public and the IIIF/thumbnail URLs come from the Omeka S API on the
#     incremental update path (M4). HF does not expose Omeka ACL state.

name: iwac_v2

# Global curation set linked to this collection. The set itself is created
# (idempotently) by src/Indexer/CurationSync.php during the bulk reindex.
# Its only purpose is result diversification (MMR): a tag-only rule with a
# `vector_distance` similarity metric on `embedding`, so near-duplicate
# syndicated articles don't crowd the first page. INERT until a search
# passes `curation_tags: diversify` — so browse pages and page blocks that
# don't opt in are unaffected. Keep the name in sync with
# CurationSync::SET_NAME.
curation_sets:
  - iwac_diversity

# No `default_sorting_field` is set on purpose. Typesense requires the
# default sorting field to be a REQUIRED column, but the only natural
# candidates (`date`, `pub_year`) are optional — not every doc has a
# usable pub_date (audiovisual recordings often lack one, plenty of
# documents do too). The Svelte client and the SSR renderer both pass
# an explicit `sort_by` on every search (date:desc in browse mode,
# _text_match:desc on a query), so Typesense never needs the fallback.

# Token separators: Typesense splits on these in addition to whitespace.
# Including ' (apostrophe) keeps "Côte d'Ivoire" and "l'islam" indexable as
# expected.
#
# IMPORTANT: only single-BYTE characters are accepted. Typesense validates
# with std::string::size() which counts UTF-8 bytes, not codepoints — so
# multi-byte separators like `·` (middle dot, 2 bytes) are rejected with
# "`token_separators` should be an array of character symbols." Sticking
# to ASCII punctuation here.
token_separators:
  - "'"
  - "-"

# Symbols treated as part of tokens (not separators). Keep accented chars
# intact and let the French locale handle accent folding at query time.
symbols_to_index: []

fields:
  # ── Identity ──────────────────────────────────────────────────────────
  - { name: id,          type: string }                       # Omeka o:id
  - { name: identifier,  type: string, optional: true }       # citation key
  - { name: omeka_url,   type: string, index: false, optional: true }
  - { name: source_url,  type: string, index: false, optional: true }  # original publisher

  # ── Display + sort ────────────────────────────────────────────────────
  - { name: title,       type: string, sort: true }            # display + sort
  - { name: title_txt,   type: string, locale: fr, stem: true } # FTS, French analyser + stemmer
  - { name: thumbnail_url, type: string, index: false, optional: true }
  - { name: iiif_manifest, type: string, index: false, optional: true }

  # ── Authority + facets ────────────────────────────────────────────────
  - { name: creator_ss,   type: "string[]", facet: true, optional: true }
  # Single-value, sortable key derived from the FIRST author (surname-first,
  # lowercased, diacritics folded) — Typesense can't sort on the creator_ss
  # array, so the "sort by author" option on the references page sorts on
  # this instead. Populated by AbstractMapper::addCommonFacets.
  - { name: creator_sort, type: string, sort: true, optional: true }
  - { name: country_ss,   type: "string[]", facet: true, optional: true }
  - { name: newspaper_ss, type: "string[]", facet: true, optional: true }
  - { name: language_ss,  type: "string[]", facet: true, optional: true }
  - { name: type_s,       type: string,   facet: true, optional: true }   # article|publication|document|audiovisual

  # Pre-resolved entity references (joined against the `index` HF subset at
  # index time). Strings are entity Titre; o:ids are also kept for stable
  # links into Omeka.
  - { name: topics_ss,         type: "string[]", facet: true, optional: true }   # subjects
  - { name: persons_ss,        type: "string[]", facet: true, optional: true }
  - { name: places_ss,         type: "string[]", facet: true, optional: true }
  - { name: organisations_ss,  type: "string[]", facet: true, optional: true }
  - { name: events_ss,         type: "string[]", facet: true, optional: true }
  - { name: entity_ids,        type: "int32[]",  facet: false, optional: true }  # for outbound links

  # Alternative spellings of every resolved entity, indexed for FTS only.
  # Examples: typing "RCI" finds docs about "Radio Côte d'Ivoire";
  # typing "AOF" finds docs about "Afrique-Occidentale française".
  # Sourced from the `Titre alternatif` field on the HF `index` subset.
  # NOT a facet — querying via this field expands recall transparently.
  - { name: entity_aliases_txt, type: "string[]", locale: fr, facet: false, optional: true }

  # ── Time ──────────────────────────────────────────────────────────────
  - { name: date,           type: int64, facet: false, sort: true, optional: true }   # epoch seconds
  - { name: date_decade_ss, type: "string[]", facet: true, optional: true }              # ["1990s"]
  - { name: pub_year,       type: int32, facet: true, sort: true, optional: true }

  # ── Body / OCR ────────────────────────────────────────────────────────
  # ocr_text is INDEXED (so matches work) but EXCLUDED from public results
  # via the scoped key (exclude_fields: ocr_text). Highlights still ship.
  # Loosening this requires licensing sign-off — see roadmap "Security model".
  - { name: ocr_text,    type: string, locale: fr, stem: true, optional: true }
  - { name: nb_words,    type: int32,  facet: false, optional: true }
  - { name: lda_topic_label, type: string, facet: true, optional: true }

  # ── Abstract / description (display body, public-safe) ─────────────────
  # Two sources feed this one field, by design:
  #   1. References — the real, human-written `abstract` (ReferenceMapper).
  #      References have no OCR; the abstract IS the body text.
  #   2. Primary sources (articles / documents / audiovisual) — the
  #      AI-generated `descriptionAI` summary (addDescription() in the
  #      mappers). A short clean French précis, distinct from the
  #      licensing-restricted OCR.
  # Visible in public results (NOT in the scoped key's exclude_fields) so
  # the result card can show a couple of lines for every type. Also in
  # query_by, so the summary lightly improves recall.
  - { name: abstract,    type: string, locale: fr, stem: true, optional: true }
  # The 9 RDF classes that appear in the references subset:
  #   Article de revue · Chapitre · Thèse · Livre · Rapport ·
  #   Communication · Compte rendu · Ouvrage collectif · Article de blog.
  # Stored as a string array (single value per doc) so the public facet
  # UI treats it the same as country_ss / newspaper_ss.
  - { name: reference_type_ss, type: "string[]", facet: true, optional: true }
  # DOI is stored for outbound linking but not searchable (matching DOIs
  # by typo or partial string isn't a useful workflow).
  - { name: doi, type: string, index: false, optional: true }

  # Reference bibliographic detail — stored display-only (index:false) and
  # rendered as the source/citation line on reference result cards. Populated
  # by ReferenceMapper from the HF references columns; absent on other subsets.
  # `publisher` holds the JOURNAL title for journal articles and the publisher
  # for books/chapters/theses/reports; `book_title` is the containing book for
  # chapters. The client formats these into a citation per reference type, so
  # tweaking the format is a rebuild, not a reindex.
  - { name: publisher_s,  type: string,     index: false, optional: true }
  - { name: book_title_s, type: string,     index: false, optional: true }
  - { name: volume_s,     type: string,     index: false, optional: true }
  - { name: issue_s,      type: string,     index: false, optional: true }
  - { name: pages_s,      type: string,     index: false, optional: true }
  - { name: editor_ss,    type: "string[]", index: false, optional: true }
  - { name: edition_s,    type: string,     index: false, optional: true }

  # ── AI sentiment (3 models — keep all three for cross-model queries) ──
  # `centralite` and `polarite` are categorical → facets.
  # `subjectivite` is 1–5 float → range facet + sort.
  - { name: gemini_centralite_ss,    type: "string[]", facet: true, optional: true }
  - { name: gemini_polarite_ss,      type: "string[]", facet: true, optional: true }
  - { name: gemini_subjectivite,     type: float,    facet: true, sort: true, optional: true }
  - { name: chatgpt_centralite_ss,   type: "string[]", facet: true, optional: true }
  - { name: chatgpt_polarite_ss,     type: "string[]", facet: true, optional: true }
  - { name: chatgpt_subjectivite,    type: float,    facet: true, sort: true, optional: true }
  - { name: mistral_centralite_ss,   type: "string[]", facet: true, optional: true }
  - { name: mistral_polarite_ss,     type: "string[]", facet: true, optional: true }
  - { name: mistral_subjectivite,    type: float,    facet: true, sort: true, optional: true }

  # ── ACL ───────────────────────────────────────────────────────────────
  # Sourced from Omeka, NOT HF. Public scoped keys carry filter_by:is_public:=true
  # as a hard filter. Even if the indexer briefly lags an Omeka ACL change,
  # the public key cannot return private docs.
  - { name: is_public,    type: bool, facet: false }
  - { name: item_set_ids, type: "int32[]", facet: false, optional: true }

  # ── Semantic search ───────────────────────────────────────────────────
  # Auto-embedded by Typesense from title_txt + ocr_text using the in-process
  # multilingual-e5-small ONNX model. Same model encodes user queries at
  # search time, so no external API needed.
  #
  # Memory note: the model resident set is ~500 MB. The IWAC-docker stack
  # bumps the typesense container limits to 4 GiB before this lands.
  - name: embedding
    type: "float[]"
    num_dim: 384
    optional: true
    embed:
      from:
        - title_txt
        - ocr_text
      model_config:
        model_name: ts/multilingual-e5-small
