# IwacSearch — Typesense collection schema
#
# This file is the contract between the indexer and the search UI. Every
# downstream artefact (Svelte facet panel, scoped-key rules, browse configs)
# derives from it. Edit with care.
#
# Conventions:
#   - Names ending in `_ss` are multi-valued strings (facets).
#   - Names ending in `_s`  are single-valued strings (sort keys).
#   - Names ending in `_txt` are full-text indexed.
#   - ACCENTS (v3): the searchable text fields deliberately carry NO
#     `locale: fr`. With `locale: fr` Typesense preserves diacritics (ICU
#     tokenization) and an unaccented query only matches via typo
#     tolerance — measured live on v2: "Cote d'Ivoire" found 2 docs where
#     "Côte d'Ivoire" found 397. There is no folding option for non-en
#     locales (typesense#2093, typesense#2354). The default (en) pipeline
#     folds European diacritics at BOTH index and query time, so
#     cote=Côte, evenement=événement, while highlights still show the
#     original accented text.
#   - The PROSE fields (title_txt, ocr_text, abstract) carry `stem: true`.
#     Without a locale the stemmer is English Snowball, not French — it
#     still folds the plural/feminine endings that motivated stemming in
#     v2 (musulman/musulmans/musulmane, islamique/islamiques), and the
#     accent folding above now also unifies spelling variants
#     (événement/évènement) the French stemmer never handled.
#     entity_aliases_txt is deliberately NOT stemmed — it holds proper
#     nouns and acronyms (AOF, RCI, names) that a stemmer would mangle.
#   - The stopword set fr_default must be PUT with locale "en" (see
#     data/stopwords-fr.json) so its tokens are folded the same way as
#     query tokens; a locale-fr set would keep "été"/"même" accented and
#     stop matching the folded query stream.
#   - `embedding` uses Typesense's in-process ts/multilingual-e5-small ONNX
#     model (384d). Re-embedded at index AND query time, so no external API
#     dependency at search time.
#
# Versioning:
#   - The actual collection is named `iwac_v6` and aliased as `iwac_current`.
#     (v1 → v2: French stemming + the `iwac_diversity` curation set.
#      v2 → v3: accent-insensitive indexing (locale dropped), alt_title_txt,
#      subjects_ss, searchable/facetable publisher_s + book_title_s, and the
#      has_fulltext flag — all index-time changes that need a fresh
#      collection.
#      v3 → v4: the nine AI-sentiment fields are renamed from the vendor slot
#      to the model that produced the value, matching the Hugging Face
#      dataset's 2026-07-31 rename. A field rename is a fresh collection —
#      Typesense cannot rename in place.
#      v4 → v5: publication tables of contents become a searchable/stemmed
#      `toc_txt` field and join the document embedding.
#      v5 → v6: the sentiment fields move from the GENERATION-1 annotators
#      (gemini-3-flash-preview / gpt-5-mini / ministral-14b-2512, read from
#      the vendor-slot Omeka properties) to the GENERATION-2 ones —
#      gpt-5.6-luna, mistral-small-2603, deepseek-v4-flash-0731. New field
#      names, so a fresh collection; the v3→v4 note below on why they are
#      keyed by model still applies, and applies more cleanly here because
#      generation 2's Omeka properties already name the model.
#      v6 → v7: the audiovisual contract grows to fit the YouTube influx
#      (class 38 went from 47 deposited recordings to 1,146 items in August
#      2026, the rest embedded videos on resource template 23). New fields:
#      channel_ss (the producing channel — was landing in newspaper_ss, which
#      labelled a YouTube channel "Journal"), media_kind_s / media_platform_s
#      (normalised from the French dcterms:type + dcterms:medium headings, so
#      a visitor can tell web video from a deposited DVD without reading raw
#      localised strings), duration_seconds (parsed from the ISO-8601
#      dcterms:extent) and rights_s.
#      v7 → v8: `author_entity_ids` + `publisher_entity_ids` — the resolved
#      AUTHORSHIP and PUBLISHER links, which until now were indexed only as
#      display strings (creator_ss, newspaper_ss/channel_ss). Without the ids
#      the entity collection could not count those roles, so `frequency`
#      silently meant subject+spatial only from v2.0.0 on — against Hugging
#      Face, whose FREQUENCY_SOURCE_FIELDS has always counted author, editor
#      and publisher too. ~3,045 authority records rendered a false "0
#      mentions" on the search page, including every newspaper and YouTube
#      channel; Wanlé Gérard Coulibaly read 0 on the site and 8 on HF.
#      Restores that parity — see the note in EntityOccurrences.)
#   - Schema changes ⇒ bump the name (`iwac_v7` → `iwac_v8`), atomic-swap
#     the alias. The browser only ever queries the alias, so swaps are
#     zero-downtime.
#
# Source-of-truth: the Omeka S MySQL database. The indexer (OmekaSourceReader)
# reads every field — title, ocr_text (bibo:content), sentiment (iwac:*),
# entities, is_public, IIIF/thumbnail URLs — directly via Doctrine DBAL, on
# both the bulk reindex and the M4 incremental path. No Hugging Face.
# country_ss is derived (newspaper→country / item-set). See docs/data-sources.md.

name: iwac_v8

# Global curation set linked to this collection. The set itself is created
# (idempotently) by src/Indexer/CurationSync.php during the bulk reindex.
# Its only purpose is result diversification (MMR): a tag-only rule with a
# `vector_distance` similarity metric on `embedding`, so near-duplicate
# syndicated articles don't crowd the first page. INERT until a search
# passes `curation_tags: diversify` — so browse pages and page blocks that
# don't opt in are unaffected. Keep the name in sync with
# CurationSync::SET_NAME.
curation_sets:
  - iwac_diversity

# Global synonym set linked to this collection. Created (idempotently) by
# src/Indexer/SynonymsSync.php from data/synonyms-fr.json during the bulk
# reindex — or standalone via cli/synonyms-sync.php / the admin button.
# Holds transliteration variants of Arabic loanwords (cheikh/sheikh/shaykh,
# Tidjaniyya/Tijaniyya, El Hadj/Alhaji, charia/sharia…). Once linked,
# expansion is automatic on every search against this collection — no
# client parameter. Keep the name in sync with SynonymsSync::SET_NAME.
synonym_sets:
  - iwac_synonyms

# No `default_sorting_field` is set on purpose. Typesense requires the
# default sorting field to be a REQUIRED column, but the only natural
# candidates (`date`, `pub_year`) are optional — not every doc has a
# usable pub_date (audiovisual recordings often lack one, plenty of
# documents do too). The Svelte client and the SSR renderer both pass
# an explicit `sort_by` on every search (date:desc in browse mode,
# _text_match:desc on a query), so Typesense never needs the fallback.

# Token separators: Typesense splits on these in addition to whitespace.
# Including ' (apostrophe) keeps "Côte d'Ivoire" and "l'islam" indexable as
# expected.
#
# IMPORTANT: only single-BYTE characters are accepted. Typesense validates
# with std::string::size() which counts UTF-8 bytes, not codepoints — so
# multi-byte separators like `·` (middle dot, 2 bytes) are rejected with
# "`token_separators` should be an array of character symbols." Sticking
# to ASCII punctuation here.
token_separators:
  - "'"
  - "-"

# Symbols treated as part of tokens (not separators). Accented characters
# are folded to ASCII by the default-locale pipeline (see the ACCENTS note
# above) — display text keeps its accents, only the index is folded.
symbols_to_index: []

fields:
  # ── Identity ──────────────────────────────────────────────────────────
  - { name: id,          type: string }                       # Omeka o:id
  - { name: identifier,  type: string, optional: true }       # citation key
  - { name: omeka_url,   type: string, index: false, optional: true }
  - { name: source_url,  type: string, index: false, optional: true }  # original publisher

  # ── Display + sort ────────────────────────────────────────────────────
  - { name: title,       type: string, sort: true }            # display + sort
  - { name: title_txt,   type: string, stem: true }            # FTS, accent-folded + stemmed
  # Alternative titles (dcterms:alternative on the item itself) — second
  # FTS title channel so a search for the variant finds the item. Also in
  # the suggest query_by so the autocomplete reconciles variant titles.
  - { name: alt_title_txt, type: "string[]", stem: true, optional: true }
  - { name: thumbnail_url, type: string, index: false, optional: true }
  - { name: iiif_manifest, type: string, index: false, optional: true }

  # ── Authority + facets ────────────────────────────────────────────────
  - { name: creator_ss,   type: "string[]", facet: true, optional: true }
  # Single-value, sortable key derived from the FIRST author (surname-first,
  # lowercased, diacritics folded) — Typesense can't sort on the creator_ss
  # array, so the "sort by author" option on the references page sorts on
  # this instead. Populated by AbstractMapper::addCommonFacets.
  - { name: creator_sort, type: string, sort: true, optional: true }
  - { name: country_ss,   type: "string[]", facet: true, optional: true }
  - { name: newspaper_ss, type: "string[]", facet: true, optional: true }
  - { name: language_ss,  type: "string[]", facet: true, optional: true }
  - { name: type_s,       type: string,   facet: true, optional: true }   # article|publication|document|audiovisual|photograph|reference

  # ── Audiovisual (class 38) ────────────────────────────────────────────
  # The producing channel / organisation — `dcterms:publisher` on an
  # audiovisual record. Deliberately NOT newspaper_ss: on template-23
  # records the publisher is a YouTube channel (RTB, CERFI, L'Autregard),
  # and filing it under a facet labelled "Journal / Newspaper" told the
  # visitor something untrue. Every other subset keeps newspaper_ss.
  # Searchable (SearchDefaults::CONTENT_QUERY_BY) so a channel name finds
  # its videos, and suggestable in the typeahead.
  - { name: channel_ss,       type: "string[]", facet: true, optional: true }
  # Normalised from the French controlled headings, so neither the facet UI
  # nor a share link depends on the localised source string:
  #   media_kind_s     `dcterms:type`   "Enregistrement vidéo" → video
  #   media_platform_s `dcterms:medium` "Vidéo sur le web" → youtube | web,
  #                                     "DVD" → dvd, "CD" → cd
  # An unrecognised heading yields NO value rather than a guess (same rule
  # the subjectivité labels follow).
  - { name: media_kind_s,     type: string,   facet: true, optional: true }   # video|audio
  - { name: media_platform_s, type: string,   facet: true, optional: true }   # youtube|web|dvd|cd
  # Running time in seconds, parsed from the ISO-8601 `dcterms:extent`
  # duration ("PT5M32S" → 332). Sortable + range-filterable; NOT a sidebar
  # facet (a facet over ~900 distinct running times is a wall, not a
  # filter), and the card formats it back to h:mm:ss for display.
  - { name: duration_seconds, type: int32,    facet: false, sort: true, optional: true }
  # Rights statement LABEL (`dcterms:rights`, a rightsstatements.org URI
  # whose literal is the label): "In Copyright" / "In Copyright -
  # Rights-Holder(s) Unlocatable or Unidentifiable".
  - { name: rights_s,         type: string,   facet: true, optional: true }

  # Pre-resolved entity references, resolved through EntityAuthority built from
  # the Omeka authority classes at index time. Strings are entity Titre; o:ids
  # are also kept for stable links into Omeka.
  - { name: topics_ss,         type: "string[]", facet: true, optional: true }   # subjects
  - { name: persons_ss,        type: "string[]", facet: true, optional: true }
  - { name: places_ss,         type: "string[]", facet: true, optional: true }
  - { name: organisations_ss,  type: "string[]", facet: true, optional: true }
  - { name: events_ss,         type: "string[]", facet: true, optional: true }
  # MERGED subject facet: every dcterms:subject linked title regardless of
  # entity class — persons, organisations and topics in ONE list. Used on
  # the references scope, where splitting the few subject tags across three
  # facet groups read as noise. dcterms:spatial deliberately NOT included.
  - { name: subjects_ss,       type: "string[]", facet: true, optional: true }
  - { name: entity_ids,        type: "int32[]",  facet: false, optional: true }  # for outbound links
  # OCCURRENCE-ROLE links, kept apart from entity_ids because they are NOT
  # subject headings and must never reach persons_ss/topics_ss. Both feed the
  # entity collection's `frequency` (union, deduped per item — see
  # EntityOccurrences), matching the HF `index` definition.
  #
  #   author_entity_ids    ← dcterms:creator; bibo:authorList + bibo:editorList
  #                          on references. dcterms:contributor is EXCLUDED:
  #                          on this archive it holds the curator, so counting
  #                          it would credit one record with the whole corpus.
  #                          Also feeds `authored_count` on its own.
  #   publisher_entity_ids ← dcterms:publisher, on references + audiovisual
  #                          only (HF's scoping — it is what gives a YouTube
  #                          channel a real figure).
  - { name: author_entity_ids,    type: "int32[]", facet: false, optional: true }
  - { name: publisher_entity_ids, type: "int32[]", facet: false, optional: true }

  # Alternative spellings of every resolved entity, indexed for FTS only.
  # Examples: typing "RCI" finds docs about "Radio Côte d'Ivoire";
  # typing "AOF" finds docs about "Afrique-Occidentale française".
  # Sourced from dcterms:alternative on the resolved entity items.
  # NOT a facet — querying via this field expands recall transparently.
  - { name: entity_aliases_txt, type: "string[]", facet: false, optional: true }

  # ── Time ──────────────────────────────────────────────────────────────
  - { name: date,           type: int64, facet: false, sort: true, optional: true }   # epoch seconds
  - { name: date_decade_ss, type: "string[]", facet: true, optional: true }              # ["1990s"]
  - { name: pub_year,       type: int32, facet: true, sort: true, optional: true }

  # ── Body / OCR ────────────────────────────────────────────────────────
  # ocr_text is INDEXED (so matches work) but EXCLUDED from public results
  # via the scoped key (exclude_fields: ocr_text,toc_txt). Highlights still ship.
  # Loosening this requires licensing sign-off — see roadmap "Security model".
  - { name: ocr_text,    type: string, stem: true, optional: true }
  # Curated issue-level table of contents (`dcterms:tableOfContents`). Like
  # OCR, the full blob is excluded from public result documents while a
  # sanitized matching snippet may ship. PublicationMapper also puts a
  # bounded excerpt in `abstract` for browse/result-card display.
  - { name: toc_txt,    type: string, stem: true, optional: true }
  - { name: nb_words,    type: int32,  facet: false, optional: true }
  # Whether the item's full text (bibo:content) is PUBLICLY READABLE on the
  # item page — i.e. the value exists AND its Omeka value-level visibility
  # is public. Distinct from "ocr_text is indexed": licensing-restricted
  # OCR is still searchable (snippet highlights only), it just isn't
  # readable in full. Set true/false on the four primary-source subsets;
  # ABSENT on references (they have no OCR), so the "Full text available"
  # facet never shows on the references / index scopes.
  - { name: has_fulltext, type: bool, facet: true, optional: true }

  # ── Abstract / description (display body, public-safe) ─────────────────
  # Two sources feed this one field, by design:
  #   1. References — the real, human-written `abstract` (ReferenceMapper).
  #      References have no OCR; the abstract IS the body text.
  #   2. Primary sources (articles / documents / audiovisual / photographs)
  #      — the AI-generated `descriptionAI` summary, falling back to
  #      `dcterms:description` where no AI summary exists.
  #   3. Publications — a bounded excerpt of `dcterms:tableOfContents`; the
  #      complete text remains searchable in `toc_txt`.
  # Visible in public results (NOT in the scoped key's exclude_fields) so
  # the result card can show a couple of lines for every type. Also in
  # query_by, so the summary lightly improves recall.
  - { name: abstract,    type: string, stem: true, optional: true }
  # The 9 RDF classes that appear in the references subset:
  #   Article de revue · Chapitre · Thèse · Livre · Rapport ·
  #   Communication · Compte rendu · Ouvrage collectif · Article de blog.
  # Stored as a string array (single value per doc) so the public facet
  # UI treats it the same as country_ss / newspaper_ss.
  - { name: reference_type_ss, type: "string[]", facet: true, optional: true }
  # DOI is stored for outbound linking but not searchable (matching DOIs
  # by typo or partial string isn't a useful workflow).
  - { name: doi, type: string, index: false, optional: true }

  # Reference bibliographic detail, rendered as the source/citation line on
  # reference result cards. Populated by ReferenceMapper; absent on other
  # subsets. `publisher` holds the JOURNAL title for journal articles and
  # the publisher for books/chapters/theses/reports; `book_title` is the
  # containing book for chapters. The client formats these into a citation
  # per reference type, so tweaking the format is a rebuild, not a reindex.
  #
  # v3: publisher_s and book_title_s are INDEXED + FACETED (they were
  # display-only) so the references scope can filter by journal/publisher
  # and the autocomplete can suggest journals, publishers and book titles
  # (facet_query + query_by). volume/issue/pages/editor/edition stay
  # display-only.
  - { name: publisher_s,  type: string,     facet: true, optional: true }
  - { name: book_title_s, type: string,     facet: true, optional: true }
  - { name: volume_s,     type: string,     index: false, optional: true }
  - { name: issue_s,      type: string,     index: false, optional: true }
  - { name: pages_s,      type: string,     index: false, optional: true }
  - { name: editor_ss,    type: "string[]", index: false, optional: true }
  - { name: edition_s,    type: string,     index: false, optional: true }

  # ── AI sentiment (3 models — keep all three for cross-model queries) ──
  # `centralite` and `polarite` are categorical → facets.
  # `subjectivite` is 1–5 float → range facet + sort.
  #
  # Fields are keyed by the MODEL that produced the value, matching the
  # Hugging Face dataset's column names so the index, the dataset and the
  # docs all name the same thing. A re-annotation with different models
  # means NEW field names, not silently changed values under the old ones —
  # that is what the v3→v4 and v5→v6 bumps both are.
  #
  # v6 indexes the GENERATION-2 annotators, whose Omeka properties name the
  # model outright (`iwac:gpt56LunaPolarite`, `iwac:mistralSmall2603Polarite`,
  # `iwac:deepseekV4Flash0731Polarite`) rather than a vendor slot, so the
  # field name and the source property finally agree. The generation-1 slots
  # (`iwac:gemini*` / `iwac:chatgpt*` / `iwac:mistral*`, indexed through v5 as
  # `gemini_3_flash_preview_*` / `gpt_5_mini_*` / `ministral_14b_2512_*`) are
  # no longer indexed; their values remain in Omeka and in the dataset.
  # AbstractMapper::SENTIMENT_MODELS holds the Omeka-term → field-prefix map.
  #
  # Subjectivité is stored in Omeka as a linked CATEGORY for every model
  # ("Très objectif" … "Très subjectif", items 78043–78047); the mapper
  # resolves it to the 1–5 score this float field expects.
  - { name: gpt_5_6_luna_centralite_ss,           type: "string[]", facet: true, optional: true }
  - { name: gpt_5_6_luna_polarite_ss,             type: "string[]", facet: true, optional: true }
  - { name: gpt_5_6_luna_subjectivite,            type: float,    facet: true, sort: true, optional: true }
  - { name: mistral_small_2603_centralite_ss,     type: "string[]", facet: true, optional: true }
  - { name: mistral_small_2603_polarite_ss,       type: "string[]", facet: true, optional: true }
  - { name: mistral_small_2603_subjectivite,      type: float,    facet: true, sort: true, optional: true }
  - { name: deepseek_v4_flash_0731_centralite_ss, type: "string[]", facet: true, optional: true }
  - { name: deepseek_v4_flash_0731_polarite_ss,   type: "string[]", facet: true, optional: true }
  - { name: deepseek_v4_flash_0731_subjectivite,  type: float,    facet: true, sort: true, optional: true }

  # ── ACL ───────────────────────────────────────────────────────────────
  # Sourced from Omeka, NOT HF. Public scoped keys carry filter_by:is_public:=true
  # as a hard filter. Even if the indexer briefly lags an Omeka ACL change,
  # the public key cannot return private docs.
  - { name: is_public,    type: bool, facet: false }
  - { name: item_set_ids, type: "int32[]", facet: false, optional: true }

  # ── Semantic search ───────────────────────────────────────────────────
  # Auto-embedded by Typesense from title_txt + ocr_text + toc_txt using the
  # in-process multilingual-e5-small ONNX model. Same model encodes user
  # queries at search time, so no external API needed.
  #
  # Memory note: the model resident set is ~500 MB. The IWAC-docker stack
  # bumps the typesense container limits to 4 GiB before this lands.
  - name: embedding
    type: "float[]"
    num_dim: 384
    optional: true
    embed:
      from:
        - title_txt
        - ocr_text
        - toc_txt
      model_config:
        model_name: ts/multilingual-e5-small
