# IwacSearch — INDEX (authority) collection schema
#
# A SECOND Typesense collection, separate from the content collection
# (data/schema.yaml). It holds the Omeka authority records that correspond to
# the historical IWAC `index` subset — persons, places, organisations, events,
# subjects, and authority notices — so they can be browsed on their own faceted
# page without polluting the article/document search.
#
# Built by IndexReindexer from the Omeka authority records, on the same
# discovery:reindex run that rebuilds the content collection. Versioned +
# alias-swapped exactly like the content collection:
#   real collection `iwac_index_v3`, aliased `iwac_index_current`.
#   (v1 → v2: accent-insensitive indexing — locale dropped, see the ACCENTS
#    note in schema.yaml — plus the is_part_of_ss facet.
#    v2 → v3: `geo` geopoint + `has_coords` flag for the map view — the old
#    display-only `coordinates` string stays for popups/back-compat.)
#
# The public scoped key (collections: ['*']) covers this collection too,
# and still carries filter_by:is_public:=true — entities default to
# is_public=false in the mapper and are flipped true via the Omeka ACL
# overlay, same safe-closed model as content.

name: iwac_index_v3

# frequency (occurrence count) is present on every row, so it's a valid
# default sort — "most mentioned first" is the natural browse order.
default_sorting_field: frequency

token_separators:
  - "'"
  - "-"
symbols_to_index: []

fields:
  # ── Identity ──────────────────────────────────────────────────────────
  - { name: id,            type: string }                       # Omeka o:id
  - { name: identifier,    type: string, index: false, optional: true }
  - { name: omeka_url,     type: string, index: false, optional: true }
  - { name: thumbnail_url, type: string, index: false, optional: true }

  # ── Display + sort + FTS ──────────────────────────────────────────────
  # No locale on the FTS fields: the default pipeline folds diacritics at
  # index + query time (accent-insensitive search) — see schema.yaml.
  #
  # DELIBERATE ASYMMETRY, not drift: content's title_txt carries
  # `stem: true`, this one does NOT. Entity titles are proper nouns —
  # people, places, organisations — and a French stemmer mangles them
  # ("Tijaniyya" and "Tijaniyyas" are not the same entity, while "Bamako"
  # risks losing its tail to a plural rule). Content titles are prose and
  # genuinely benefit from stemming. Alias reconciliation on this
  # collection is handled by entity_aliases_txt and the global synonym
  # set, not by stemming.
  - { name: title,     type: string, sort: true }               # entity name (A–Z sort)
  - { name: title_txt, type: string }                           # FTS, accent-folded, NOT stemmed (see above)
  # Alternative spellings ("RCI" → "Radio Côte d'Ivoire"), FTS only.
  - { name: entity_aliases_txt, type: "string[]", facet: false, optional: true }
  - { name: description, type: string, optional: true }

  # ── Entity type (the facet that slices the index) ─────────────────────
  # Personnes | Lieux | Organisations | Événements | Sujets | Notices d'autorité
  - { name: entity_type_s, type: string, facet: true }

  # dcterms:isPartOf on the entity item. For organisations this is the
  # ORGANISATION CATEGORY ("Organisation islamique", …); other types use it
  # for broader-entity links. Faceted so the index page can slice
  # organisations by kind — and so inconsistent values are visible (the
  # facet doubles as the data-cleaning worklist).
  - { name: is_part_of_ss, type: "string[]", facet: true, optional: true }

  # ── Occurrence metrics ────────────────────────────────────────────────
  # frequency = how many content items reference this entity. Sort key +
  # default sort; NOT a facet (too many distinct values).
  - { name: frequency, type: int32, facet: false, sort: true }
  - { name: country_ss, type: "string[]", facet: true, optional: true }   # countries it appears in
  - { name: first_year, type: int32, facet: false, sort: true, optional: true }
  - { name: last_year,  type: int32, facet: false, sort: true, optional: true }
  # last_occurrence epoch — lets date:desc mean "most recently mentioned",
  # and pub_year (= last_year) drives the year slider, reusing the content
  # client's date handling unchanged.
  - { name: date,     type: int64, facet: false, sort: true, optional: true }
  - { name: pub_year, type: int32, facet: true,  sort: true, optional: true }
  # Compact "year:count;…" mention histogram — display-only, powers the
  # entity-card sparkline (design review §03B). index:false (never searched
  # or faceted) and optional, so older snapshots without it just omit it.
  - { name: mentions_by_year_s, type: string, index: false, optional: true }

  # ── Geo ───────────────────────────────────────────────────────────────
  # geo is a real Typesense geopoint ([lat, lng] float pair — NOT the
  # GeoJSON [lng, lat] order) parsed by IndexEntityMapper from the
  # curation:coordinates literal. Powers the map view: radius/polygon
  # filter_by and distance sort_by both work on it.
  #
  # has_coords exists because Typesense cannot filter "field is present"
  # on an optional field (typesense#798) — the map fetch filters
  # `has_coords:=true` instead. Present (true) only when geo is set.
  #
  # The original "lat, lng" string stays display-only for popups and as
  # the raw curated value.
  - { name: geo,         type: geopoint, optional: true }
  - { name: has_coords,  type: bool, facet: false, optional: true }
  - { name: coordinates, type: string, index: false, optional: true }

  # ── ACL (same model as content) ──────────────────────────────────────
  - { name: is_public, type: bool, facet: false }
